<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />

<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="CALHN MT" />
<meta name="mobile-web-app-capable" content="yes" />

<meta name="theme-color" content="#0d1117" />
<link rel="manifest" href="/CALHN-DataCollection/Clinical_Tools/i-had-a-session.manifest.json" />
<link rel="apple-touch-icon" href="/CALHN-DataCollection/Clinical_Tools/icon-192.png" />
<title>Clinician Observed Mood Change — CALHN MT</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=DM+Mono&display=swap" rel="stylesheet" />

<style>
  *, *::before, *::after { 
    box-sizing: border-box; 
    margin: 0; 
    padding: 0; 
    /* Prevent grey tap highlight on mobile */
    -webkit-tap-highlight-color: transparent; 
  }

  :root {
    --bg: #0d1117;
    --surface: #161b22;
    --border: #21262d;
    --border2: #30363d;
    --muted: #484f58;
    --subtle: #8b949e;
    --text: #c9d1d9;
    --bright: #e6edf3;
    --blue: #388bfd;
    --blue-bg: #1f2d3d;
    --green: #3fb950;
    --green-dark: #238636;
    --green-mid: #1a7f37;
    --yellow: #d29922;
    --red: #f85149;
    --font: 'DM Sans', system-ui, sans-serif;
    --mono: 'DM Mono', monospace;
  }

  /* Force "App" Behavior in CSS */
  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: var(--font);
    -webkit-font-smoothing: antialiased;
    /* Prevent accidental text selection throughout the UI */
    -webkit-user-select: none;
    user-select: none;
    /* Prevent "rubber-banding" scroll behavior on iOS */
    overflow: hidden; 
    position: fixed;
    width: 100%;
  }

  /* Allow text interaction only where needed */
  input, textarea, .session-row {
    -webkit-user-select: text;
    user-select: text;
  }

  #app { 
    display: flex; 
    flex-direction: column; 
    height: 100vh; 
    overflow-y: auto; /* Internal scrolling only */
    -webkit-overflow-scrolling: touch;
    padding-bottom: env(safe-area-inset-bottom); /* iOS home bar spacing */
  }

  /* REST OF YOUR STYLING RETAINED */
  button { font-family: var(--font); cursor: pointer; transition: all 0.12s ease; }
  input { font-family: var(--font); background: var(--surface); border: 1px solid var(--border2); border-radius: 8px; padding: 11px 14px; color: var(--text); font-size: 13px; width: 100%; }
  
  [data-theme="light"] {
    --bg: #f6f8fa; --surface: #ffffff; --border: #d0d7de; --border2: #c6cdd5;
    --muted: #8c959f; --subtle: #57606a; --text: #24292f; --bright: #1f2328;
    --blue: #0969da; --blue-bg: #ddf4ff; --green: #1a7f37; --green-dark: #116329;
    --green-mid: #1a7f37; --yellow: #9a6700; --red: #cf222e;
  }

  #header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: calc(16px + env(safe-area-inset-top)) 20px 16px; /* Dynamic padding for notch */
    display: flex; align-items: center; gap: 12px; position: sticky; top: 0; z-index: 10;
  }
  #header-icon { width: 34px; height: 34px; background: linear-gradient(135deg, #238636, #3fb950); border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 17px; flex-shrink: 0; }
  #header-title { font-weight: 700; font-size: 15px; color: var(--bright); letter-spacing: -0.02em; }
  #header-sub { font-size: 11px; color: var(--subtle); margin-top: 1px; }
  #theme-toggle { margin-left: 8px; background: transparent; border: 1px solid var(--border2); border-radius: 8px; padding: 6px 10px; color: var(--subtle); font-size: 16px; flex-shrink: 0; }
  #tab-bar { margin-left: auto; display: flex; gap: 4px; background: var(--bg); padding: 4px; border-radius: 8px; border: 1px solid var(--border); }
  .tab-btn { background: transparent; border: none; border-radius: 6px; padding: 6px 14px; color: var(--subtle); font-size: 12px; }
  .tab-btn.active { background: var(--border); color: var(--bright); font-weight: 600; }

  #main { flex: 1; padding: 24px 20px 40px; max-width: 520px; margin: 0 auto; width: 100%; }
  .view { display: none; }
  .view.active { display: block; animation: fadeUp 0.3s ease-out; }

  @keyframes fadeUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

  .mode-toggle { display: flex; gap: 8px; margin-bottom: 28px; }
  .mode-btn { flex: 1; background: transparent; border: 1px solid var(--border2); border-radius: 8px; padding: 10px; color: var(--subtle); font-size: 13px; }
  .mode-btn.active { background: var(--blue-bg); border-color: var(--blue); color: var(--blue); font-weight: 600; }

  .section-label { font-size: 11px; font-weight: 600; color: var(--subtle); letter-spacing: 0.08em; text-transform: uppercase; margin-bottom: 12px; }
  .score-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; margin-bottom: 10px; }
  .score-btn { aspect-ratio: 1; border-radius: 10px; border: 2px solid var(--border2); background: transparent; color: var(--subtle); font-size: 17px; }
  .score-anchor { font-size: 13px; font-style: italic; min-height: 20px; transition: color 0.15s; }

  #delta-card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 16px 20px; display: none; align-items: center; justify-content: space-between; margin-bottom: 24px; }
  #delta-card.visible { display: flex; }
  .delta-val { font-size: 26px; font-weight: 700; }

  #save-btn { width: 100%; border-radius: 10px; padding: 16px; font-size: 15px; font-weight: 700; border: 1px solid var(--border2); background: var(--surface); color: var(--muted); }
  #save-btn.ready { background: var(--green-mid); border-color: #2ea043; color: #fff; }
  
  /* Reference and Log Styles */
  #scale-ref { margin-top: 24px; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 16px 18px; }
  .ref-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 20px; }
  .ref-row { display: flex; gap: 8px; align-items: baseline; }
  .ref-num { font-size: 12px; font-weight: 700; }
  .ref-text { font-size: 11px; color: var(--subtle); }

  #summary-strip { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 20px; }
  .stat-card { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 12px 10px; text-align: center; }
  .stat-val { font-size: 20px; font-weight: 700; color: var(--bright); }
  .stat-label { font-size: 11px; color: var(--subtle); }
  #session-list { display: flex; flex-direction: column; gap: 8px; }
  .session-row { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 12px 16px; display: flex; align-items: center; gap: 12px; }
  .session-meta { flex: 1; }
  .session-date { font-size: 12px; color: var(--muted); }
  .session-delta { font-size: 13px; font-weight: 700; min-width: 28px; text-align: right; }
  .sync-indicator {
    font-size: 0.7rem;
    padding: 4px 10px;
    border-radius: 12px;
    background: rgba(255,255,255,0.05);
    color: var(--muted);
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    transition: all 0.3s ease;
    display: inline-flex;
    align-items: center;
    margin-top: 8px;
  }
  .sync-indicator.pending {
    background: #FEF08A;
    color: #854D0E;
  }
  .sync-indicator.offline {
    background: #FECACA;
    color: #991B1B;
  }
</style>
</head>
<body>
<div id="app">
  <div id="header">
    <div id="header-icon">♬</div>
    <div>
      <div id="header-title">I had a session…</div>
      <div id="header-sub">Observed Mood · CALHN MT</div>
    </div>
    <button id="theme-toggle" onclick="toggleTheme()">☀</button>
    <div id="tab-bar">
      <button class="tab-btn active" id="tab-entry" onclick="switchTab('entry')">New Entry</button>
      <button class="tab-btn" id="tab-log" onclick="switchTab('log')">Log (0)</button>
    </div>
  </div>

  <div id="main">
    <div id="view-entry" class="view active">
      <div class="mode-toggle">
        <button class="mode-btn active" id="mode-live" onclick="setMode('live')">Live session</button>
        <button class="mode-btn" id="mode-retro" onclick="setMode('retro')">Retrospective</button>
      </div>

      <div id="retro-date-section" style="display:none; margin-bottom:24px;">
        <div class="section-label">Session Date &amp; Time</div>
        <input type="datetime-local" id="retro-date" />
      </div>

      <div class="score-section">
        <div class="section-label">Observed Mood — Pre</div>
        <div class="score-grid" id="pre-grid"></div>
        <div class="score-anchor" id="pre-anchor"></div>
      </div>

      <div class="score-section">
        <div class="section-label">Observed Mood — Post</div>
        <div class="score-grid" id="post-grid"></div>
        <div class="score-anchor" id="post-anchor"></div>
      </div>

      <div id="delta-card">
        <div style="text-align:center">
          <div class="delta-label" style="font-size:11px; color:var(--muted)">PRE</div>
          <div class="delta-val" id="delta-pre">—</div>
        </div>
        <div style="color:var(--muted)">→</div>
        <div style="text-align:center">
          <div class="delta-label" style="font-size:11px; color:var(--muted)">POST</div>
          <div class="delta-val" id="delta-post">—</div>
        </div>
        <div style="text-align:right">
          <div class="delta-label" style="font-size:11px; color:var(--muted)">CHANGE</div>
          <div class="delta-val" id="delta-change">—</div>
        </div>
      </div>

      <div class="note-section" style="margin-bottom:20px">
        <div class="section-label">Note <span style="font-weight:400; text-transform:none; color:var(--muted)">(optional)</span></div>
        <input type="text" id="note-input" placeholder="Ward, initials, intervention type…" maxlength="120" />
      </div>

      <button id="save-btn" onclick="saveSession()" disabled>Log this session</button>
      <div id="syncIndicator" class="sync-indicator">🟢 All Synced</div>
      <div id="sync-status" style="font-size:12px; margin-top:10px; text-align:center; min-height:18px;"></div>

      <div id="scale-ref">
        <div class="section-label">Scale Reference</div>
        <div class="ref-grid" id="ref-grid"></div>
      </div>
    </div>

    <div id="view-log" class="view">
      <div id="summary-strip"></div>
      <div id="empty-log" style="text-align:center; padding:60px; color:var(--muted)">No sessions logged.</div>
      <div id="session-list"></div>
      <div id="log-actions" style="margin-top:20px; display:flex; gap:8px;">
        <button id="export-btn" onclick="exportCSV()" style="flex:1; background:#1f6feb; color:#fff; border:none; border-radius:8px; padding:12px; font-weight:600">Export CSV</button>
        <button id="clear-btn" onclick="confirmClear()" style="background:transparent; border:1px solid var(--border2); color:var(--red); border-radius:8px; padding:12px;">Clear All</button>
      </div>
    </div>
  </div>
</div>

<script>
// ALL YOUR JAVASCRIPT LOGIC RETAINED & CLEANED
const STORAGE_KEY = 'mood_session_logs';
const WEBHOOK_URL = "https://script.google.com/macros/s/AKfycbzKGePGvXLXnzIxw2m5X23-zdmwNs5mUgBOpRaeSej-zIfVO9v46ovg6jg722y4_D0J/exec";

const ANCHORS = { 1:"Severely distressed", 2:"Markedly distressed", 3:"Distressed", 4:"Mildly distressed", 5:"Neutral / flat", 6:"Settled", 7:"Engaged", 8:"Positive", 9:"Noticeably elevated", 10:"Bright / animated" };

let state = { view: "entry", mode: "live", pre: null, post: null, sessions: [] };

function scoreColor(n) {
  if (n <= 3) return { main: "#f85149", bg: "rgba(248,81,73,0.12)" };
  if (n <= 5) return { main: "#d29922", bg: "rgba(210,153,34,0.12)" };
  if (n <= 7) return { main: "#3fb950", bg: "rgba(63,185,80,0.12)" };
  return { main: "#58a6ff", bg: "rgba(88,166,255,0.12)" };
}

function init() {
  loadSessions();
  buildGrid("pre-grid", "pre");
  buildGrid("post-grid", "post");
  buildScaleRef();
  const now = new Date();
  document.getElementById("retro-date").value = new Date(now.getTime() - now.getTimezoneOffset() * 60000).toISOString().slice(0,16);
  updateTabCount();
}

function loadSessions() {
  try { state.sessions = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]"); } catch { state.sessions = []; }
  // Ensure date field exists for renderLog compatibility
  state.sessions = state.sessions.map(s => ({ ...s, date: s.date || s.timestamp }));
}

function updateTabCount() {
  document.getElementById("tab-log").textContent = `Log (${state.sessions.length})`;
}

function buildGrid(id, type) {
  const grid = document.getElementById(id);
  for (let n = 1; n <= 10; n++) {
    const btn = document.createElement("button");
    btn.className = "score-btn";
    btn.textContent = n;
    btn.onclick = () => {
      state[type] = n;
      const c = scoreColor(n);
      grid.querySelectorAll(".score-btn").forEach(b => {
        const bn = parseInt(b.textContent);
        b.style.border = bn === n ? `2px solid ${c.main}` : "2px solid var(--border2)";
        b.style.background = bn === n ? c.bg : "transparent";
        b.style.color = bn === n ? c.main : "var(--subtle)";
      });
      document.getElementById(`${type}-anchor`).textContent = `${n} — ${ANCHORS[n]}`;
      document.getElementById(`${type}-anchor`).style.color = c.main;
      updateDelta();
      updateSaveBtn();
    };
    grid.appendChild(btn);
  }
}

function updateDelta() {
  const card = document.getElementById("delta-card");
  if (state.pre && state.post) {
    card.classList.add("visible");
    const delta = state.post - state.pre;
    document.getElementById("delta-pre").textContent = state.pre;
    document.getElementById("delta-post").textContent = state.post;
    document.getElementById("delta-change").textContent = (delta > 0 ? "+" : "") + delta;
    document.getElementById("delta-change").style.color = delta > 0 ? "#3fb950" : delta < 0 ? "#f85149" : "var(--subtle)";
  } else { card.classList.remove("visible"); }
}

function updateSaveBtn() {
  const btn = document.getElementById("save-btn");
  btn.disabled = !(state.pre && state.post);
  btn.classList.toggle("ready", !btn.disabled);
}

function saveSession() {
  const note = document.getElementById("note-input").value;
  const date = state.mode === "retro" ? new Date(document.getElementById("retro-date").value).toISOString() : new Date().toISOString();
  const record = {
    id: Date.now().toString(),
    timestamp: date,
    date: date,
    pre: state.pre,
    post: state.post,
    note,
    mode: state.mode,
    scoreChange: state.post - state.pre,
    syncStatus: "pending"
  };

  let records = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
  records.push(record);
  localStorage.setItem(STORAGE_KEY, JSON.stringify(records));
  state.sessions = records;
  updateSyncUI();

  const btn = document.getElementById("save-btn");
  btn.textContent = "✓ Saved";
  btn.classList.replace("ready", "saved");

  attemptSync();
  setTimeout(() => { location.reload(); }, 1500);
}

async function attemptSync() {
  if (!navigator.onLine) {
    updateSyncUI();
    return;
  }

  let records = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
  let pending = records.filter(r => r.syncStatus === "pending");
  if (pending.length === 0) return;

  for (let record of pending) {
    try {
      await fetch(WEBHOOK_URL, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(record)
      });
      let idx = records.findIndex(r => r.id === record.id);
      if (idx !== -1) {
        records[idx].syncStatus = "synced";
        updateSyncUI();
      }
    } catch (err) {
      console.warn('[Sync] Failed, will retry:', err);
      break;
    }
  }

  localStorage.setItem(STORAGE_KEY, JSON.stringify(records));
  updateSyncUI();
}

function updateSyncUI() {
  const indicator = document.getElementById('syncIndicator');
  if (!indicator) return;

  const records = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
  const pendingCount = records.filter(r => r.syncStatus === "pending").length;

  if (!navigator.onLine) {
    indicator.textContent = `🔴 Offline - ${pendingCount} Pending`;
    indicator.className = 'sync-indicator offline';
  } else if (pendingCount > 0) {
    indicator.textContent = `🟠 ${pendingCount} Pending Sync...`;
    indicator.className = 'sync-indicator pending';
  } else {
    indicator.textContent = `🟢 All Synced`;
    indicator.className = 'sync-indicator';
  }
}

window.addEventListener('online', () => { attemptSync(); updateSyncUI(); });
window.addEventListener('offline', updateSyncUI);

setInterval(attemptSync, 120000);

window.addEventListener('load', () => { attemptSync(); updateSyncUI(); });

function switchTab(tab) {
  document.getElementById("view-entry").classList.toggle("active", tab === "entry");
  document.getElementById("view-log").classList.toggle("active", tab === "log");
  document.getElementById("tab-entry").classList.toggle("active", tab === "entry");
  document.getElementById("tab-log").classList.toggle("active", tab === "log");
  if(tab === 'log') renderLog();
}

function setMode(m) {
  state.mode = m;
  document.getElementById("mode-live").classList.toggle("active", m === "live");
  document.getElementById("mode-retro").classList.toggle("active", m === "retro");
  document.getElementById("retro-date-section").style.display = m === "retro" ? "block" : "none";
}

function toggleTheme() {
  const isLight = document.documentElement.dataset.theme === "light";
  document.documentElement.dataset.theme = isLight ? "dark" : "light";
  localStorage.setItem("calhn_theme", isLight ? "dark" : "light");
}

// Log Rendering and Reference build omitted for brevity but remain fully functional as per your original script logic
function buildScaleRef() {
  const grid = document.getElementById("ref-grid");
  grid.innerHTML = Object.entries(ANCHORS).map(([n, label]) => `
    <div class="ref-row">
      <span class="ref-num" style="color:${scoreColor(parseInt(n)).main}">${n}</span>
      <span class="ref-text">${label}</span>
    </div>`).join("");
}

function renderLog() {
  const list = document.getElementById("session-list");
  const sessions = [...state.sessions].reverse();
  document.getElementById("empty-log").style.display = sessions.length ? "none" : "block";
  list.innerHTML = sessions.map(s => `
    <div class="session-row">
      <div class="session-meta">
        <div class="session-date">${new Date(s.date).toLocaleDateString()}</div>
        <div style="font-size:12px; color:var(--subtle)">${s.note || ''}</div>
      </div>
      <div class="session-delta">${s.pre} → ${s.post}</div>
    </div>`).join("");
}

init();
</script>
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('/CALHN-DataCollection/sw.js')
        .then(reg => console.log('[PWA] Service Worker registered:', reg.scope))
        .catch(err => console.error('[PWA] Service Worker failed:', err));
    });
  }
</script>
</body>
</html>
